[project]
name = "swapcert"
version = "0.1.0"
description = "Certified model-swap evaluation for LLM agents: simulation + few real rollouts -> valid CI on Δsuccess"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "typer>=0.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
swapcert = "swapcert.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swapcert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo coverage tests"]

[tool.ruff]
line-length = 100
